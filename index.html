<!DOCTYPE html>
<html lang="en">
  <head>
    <title>KEVEN VAILLANCOURT</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
    <div class="artwork">

      <div class="art-container">
        <button class="art-links" onclick="openArt(event, 'art1')">
          <img class = "art-preview" src="images/illustration_icons/art1_preview.jpg">
          <div class="art-text"><p>Green Frog</p><p>March 2021</p><p>1000 x 1000 pixels</p></div>
        </button>
      </div>

      <div id="art1" style="display: none">
            <img class="art-full" src="images/illustration_icons/art1_preview.jpg">
      </div>

      <script>
        function openArt(evt, artName) {
          var x = document.getElementById(artName);
          if (x.style.display === "none") {
            x.style.display = "block";
          } 
          else {
            x.style.display = "none";
          }
        }
      </script>

    </div>
  </body>
</html>
